<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="appBody" class="bg-slate-50 text-slate-800 min-h-screen py-12 px-4 flex items-start justify-center transition-colors duration-200">
  <main class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 transition-colors duration-200">
    <header class="flex items-start justify-between mb-6">
      <div>
        <h1 class="text-2xl font-semibold text-slate-800 dark:text-slate-100">My Tasks</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Organized, modular task manager</p>
      </div>
      <!-- Theme Switcher -->
      <button 
        id="themeToggleBtn" 
        class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition text-sm flex items-center justify-center"
        title="Toggle dark mode"
      >
        <span id="themeIcon">🌙</span>
      </button>
    </header>

    <!-- Input Form -->
    <div class="space-y-3 mb-5">
      <div class="flex gap-2">
        <input 
          id="taskInput" 
          type="text" 
          placeholder="What needs to be done?" 
          class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700 dark:text-slate-100 text-sm bg-white dark:bg-slate-700 placeholder-slate-400"
        >
        <button 
          id="addBtn" 
          class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium text-sm rounded-xl transition shadow-sm"
        >
          Add
        </button>
      </div>

      <!-- Priority & Date Inputs -->
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <label class="flex items-center gap-1.5 text-slate-500 dark:text-slate-400">
          <span>Priority:</span>
          <select 
            id="priorityInput" 
            class="px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
          >
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </label>

        <label class="flex items-center gap-1.5 text-slate-500 dark:text-slate-400">
          <span>Due:</span>
          <input 
            id="dateInput" 
            type="date" 
            class="px-2.5 py-1 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
          >
        </label>
      </div>
    </div>

    <!-- Live Search Bar -->
    <div class="relative mb-3">
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Search tasks..." 
        class="w-full pl-9 pr-4 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700 dark:text-slate-100 bg-slate-50 dark:bg-slate-700/50 placeholder-slate-400"
      >
      <span class="absolute left-3 top-2.5 text-slate-400 text-xs pointer-events-none">🔍</span>
    </div>

    <!-- Filter Pills -->
    <nav class="flex p-1 bg-slate-100 dark:bg-slate-700 rounded-xl mb-4 text-xs font-medium" aria-label="Task Filters">
      <button 
        id="filterAll" 
        class="filter-btn flex-1 py-1.5 rounded-lg text-center transition bg-white text-slate-800 shadow-sm font-semibold"
      >
        All
      </button>
      <button 
        id="filterActive" 
        class="filter-btn flex-1 py-1.5 rounded-lg text-center transition text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"
      >
        Active
      </button>
      <button 
        id="filterCompleted" 
        class="filter-btn flex-1 py-1.5 rounded-lg text-center transition text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"
      >
        Completed
      </button>
    </nav>

    <!-- Task List Container -->
    <ul id="taskList" class="space-y-2.5"></ul>
    
    <div id="emptyState" class="text-center py-8 text-slate-400 dark:text-slate-500 text-sm">
      No tasks yet. Type something above and click Add!
    </div>

    <!-- Status & Actions Footer -->
    <footer id="listFooter" class="hidden mt-6 pt-4 border-t border-slate-100 dark:border-slate-700 flex flex-col gap-3 text-xs text-slate-500 dark:text-slate-400">
      <div class="flex items-center justify-between">
        <span id="taskCounter">0 tasks remaining</span>
        <button 
          id="clearCompletedBtn" 
          class="text-rose-600 hover:text-rose-700 dark:text-rose-400 dark:hover:text-rose-300 font-medium transition disabled:opacity-40 disabled:hover:text-rose-600"
        >
          Clear Completed
        </button>
      </div>

      <!-- Backup & Restore Actions -->
      <div class="flex items-center justify-between pt-2 border-t border-slate-100/60 dark:border-slate-700/60 text-[11px] text-slate-400">
        <span>Data Tools</span>
        <div class="flex items-center gap-3">
          <button id="exportBtn" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition">Export JSON</button>
          <span>•</span>
          <button id="importBtn" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition">Import JSON</button>
          <input type="file" id="importFileInput" accept=".json" class="hidden">
        </div>
      </div>
    </footer>
  </main>

  <!-- External JavaScript File -->
  <script src="app.js"></script>
</body>
</html>
